[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-diffusers"
version = "0.1.0"
description = "Minimal Apple Silicon-friendly Diffusers sandbox."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.10.0",
  "diffusers[torch]==0.39.0",
  "huggingface-hub>=1,<2",
  "Pillow>=12.3.0",
  "safetensors>=0.6.2",
  "starlette>=1.3.1,<2",
  "transformers>=5.5.0,<6",
  "uvicorn>=0.41.0,<1",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.16.1",
]

[project.scripts]
sandbox-diffusers-generate = "sandbox_diffusers.generate:main"
sandbox-diffusers-img2img = "sandbox_diffusers.img2img:main"
sandbox-diffusers-compare = "sandbox_diffusers.compare:main"
sandbox-diffusers-ui = "sandbox_diffusers.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["SIM117"]
