name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install the locked dependency graph
        run: uv sync --config-file uv.toml --frozen --all-groups
      - name: Validate the lockfile
        run: uv lock --config-file uv.toml --check
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test security boundaries and application behavior
        run: uv run --frozen pytest -q
      - name: Audit the locked environment
        run: uv run --frozen pip-audit
      - name: Import and CLI smoke tests
        run: |
          uv run --frozen python -c "import diffusers, sandbox_diffusers; assert diffusers.__version__ == '0.38.0'"
          uv run --frozen sandbox-diffusers-generate --help >/dev/null
          uv run --frozen sandbox-diffusers-img2img --help >/dev/null
          uv run --frozen sandbox-diffusers-compare --help >/dev/null
          uv run --frozen sandbox-diffusers-ui --help >/dev/null
          uv run --frozen python -m compileall -q src tests
      - name: Build package
        run: uv build
