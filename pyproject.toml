[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-diffusers"
version = "0.1.0"
description = "Minimal Apple Silicon-friendly Diffusers sandbox."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.10.0",
  "diffusers[torch]==0.38.0",
  "gradio>=5,<6",
  "huggingface-hub>=0.34.0,<1.0",
  "Pillow>=10.4.0",
  "safetensors>=0.6.2",
  "transformers>=4.55.0,<5",
]

[project.scripts]
sandbox-diffusers-generate = "sandbox_diffusers.generate:main"
sandbox-diffusers-img2img = "sandbox_diffusers.img2img:main"
sandbox-diffusers-compare = "sandbox_diffusers.compare:main"
sandbox-diffusers-ui = "sandbox_diffusers.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
